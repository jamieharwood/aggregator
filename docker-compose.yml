# Local dependencies.
# - MongoDB holds the workflow definitions (seeded from mongo/init-workflows.js on first start).
# - The application exports OTLP to the collector on localhost:4318, and the collector forwards
#   traces to Jaeger (UI on http://localhost:16686).
services:
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: aggregator
    volumes:
      - ./mongo/init-workflows.js:/docker-entrypoint-initdb.d/init-workflows.js:ro
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP (used by the application)
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "16686:16686" # Jaeger UI

volumes:
  mongo-data:
