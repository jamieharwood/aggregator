spring:
  application:
    name: aggregator-test
  threads:
    virtual:
      enabled: true
  web:
    resources:
      add-mappings: false

management:
  endpoint:
    health:
      show-details: always
  health:
    mongodb:
      enabled: false   # the in-memory test MongoDB does not implement the 'hello' command
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    sampling:
      probability: 1.0

proxy:
  workflow-store:
    refresh-interval: 0   # tests reload explicitly
