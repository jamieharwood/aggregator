spring:
  application:
    name: ${OTEL_SERVICE_NAME:aggregator}   # also the OpenTelemetry service.name
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/aggregator}
  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8080}

# Switch for OpenTelemetry export. When false, no traces or metrics are sent and no collector is
# contacted; trace IDs still appear in logs and trace context is still propagated downstream.
otel:
  enabled: ${OTEL_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    export:
      otlp:
        enabled: ${otel.enabled}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: ${otel.enabled}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 30s

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}] "

proxy:
  connect-timeout: 2s
  workflow-store:
    collection: workflows       # one document per workflow; see README
    refresh-interval: ${WORKFLOW_REFRESH_INTERVAL:30s}   # 0 disables reloading
